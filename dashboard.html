<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Analytics - Wallpari Analytics</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .dashboard-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 3px solid var(--teal);
        }

        .dashboard-header h1 {
            color: var(--dark-blue);
            margin-bottom: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, rgba(0, 167, 157, 0.1), rgba(123, 104, 238, 0.1));
            border-radius: 12px;
            padding: 20px;
            border-left: 4px solid var(--teal);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 167, 157, 0.2);
        }

        .stat-card h3 {
            color: var(--teal);
            font-size: 0.9rem;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .stat-card .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--dark-blue);
            margin-bottom: 5px;
        }

        .stat-card .stat-label {
            color: #666;
            font-size: 0.85rem;
        }

        .section {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .section h2 {
            color: var(--dark-blue);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .access-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }

        .access-table thead {
            background: linear-gradient(135deg, var(--teal), var(--purple));
            color: white;
        }

        .access-table th,
        .access-table td {
            padding: 12px;
            text-align: left;
        }

        .access-table tbody tr:nth-child(even) {
            background: #f8f9fa;
        }

        .access-table tbody tr:hover {
            background: rgba(0, 167, 157, 0.1);
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .badge-teacher {
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            color: #333;
        }

        .badge-student {
            background: linear-gradient(135deg, var(--teal), var(--purple));
            color: white;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--teal), var(--purple));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 167, 157, 0.3);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .chart-container {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }

            .access-table {
                font-size: 0.85rem;
            }

            .access-table th,
            .access-table td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="dashboard-header">
            <h1><i class="fa-solid fa-chart-line"></i> Dashboard de Analytics</h1>
            <p style="color: #666;">Panel de control y estadísticas de uso del módulo PROMPT</p>
            <div style="margin-top: 15px;">
                <span id="teacherInfo" style="background: rgba(255, 215, 0, 0.2); padding: 8px 16px; border-radius: 20px; font-weight: 600;">
                    <i class="fa-solid fa-user-tie"></i> <span id="teacherName">Cargando...</span>
                </span>
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn btn-primary" onclick="refreshDashboard()">
                <i class="fa-solid fa-rotate"></i> Actualizar
            </button>
            <button class="btn btn-primary" onclick="Analytics.exportData()">
                <i class="fa-solid fa-download"></i> Exportar Datos
            </button>
            <button class="btn btn-secondary" onclick="window.location.href='index.html'">
                <i class="fa-solid fa-home"></i> Volver al Inicio
            </button>
            <button class="btn btn-danger" onclick="confirmClearData()">
                <i class="fa-solid fa-trash"></i> Limpiar Datos Antiguos
            </button>
        </div>

        <!-- Estadísticas Generales -->
        <div class="stats-grid" id="statsGrid">
            <!-- Se llenará dinámicamente -->
        </div>

        <!-- Accesos Recientes -->
        <div class="section">
            <h2><i class="fa-solid fa-clock"></i> Accesos Recientes al Módulo PROMPT</h2>
            <div id="recentAccessesContainer">
                <!-- Se llenará dinámicamente -->
            </div>
        </div>

        <!-- Todos los Accesos -->
        <div class="section">
            <h2><i class="fa-solid fa-list"></i> Todos los Accesos (Historial Completo)</h2>
            <div id="allAccessesContainer">
                <!-- Se llenará dinámicamente -->
            </div>
        </div>

        <!-- Estadísticas por Estudiante -->
        <div class="section">
            <h2><i class="fa-solid fa-users"></i> Estadísticas por Estudiante</h2>
            <div id="studentStatsContainer">
                <!-- Se llenará dinámicamente -->
            </div>
        </div>
    </div>

    <script src="analytics.js"></script>
    <script>
        // Verificar acceso del docente
        function checkTeacherAccess() {
            const user = Analytics.getCurrentUser();

            if (!user || !Analytics.isTeacher()) {
                alert('⚠️ Acceso denegado. Este dashboard es solo para el docente.');
                window.location.href = 'index.html';
                return false;
            }

            // Mostrar info del docente
            document.getElementById('teacherName').textContent = user['Nombre'] || 'Docente';
            return true;
        }

        // Cargar dashboard
        function loadDashboard() {
            if (!checkTeacherAccess()) return;

            const stats = Analytics.getStats();
            const data = Analytics.getData();

            // Cargar estadísticas generales
            loadGeneralStats(stats);

            // Cargar accesos recientes
            loadRecentAccesses(stats.recentAccesses);

            // Cargar todos los accesos
            loadAllAccesses(data.promptAccess);

            // Cargar estadísticas por estudiante
            loadStudentStats(data.promptAccess);
        }

        // Cargar estadísticas generales
        function loadGeneralStats(stats) {
            const statsGrid = document.getElementById('statsGrid');
            statsGrid.innerHTML = `
                <div class="stat-card">
                    <h3>📊 Total Visitas</h3>
                    <div class="stat-value">${stats.totalVisits}</div>
                    <div class="stat-label">al sitio web</div>
                </div>
                <div class="stat-card">
                    <h3>🎓 Accesos a PROMPT</h3>
                    <div class="stat-value">${stats.totalPromptAccesses}</div>
                    <div class="stat-label">accesos totales</div>
                </div>
                <div class="stat-card">
                    <h3>👥 Estudiantes Únicos</h3>
                    <div class="stat-value">${stats.uniqueStudents}</div>
                    <div class="stat-label">estudiantes distintos</div>
                </div>
                <div class="stat-card">
                    <h3>📖 Vistas de Módulos</h3>
                    <div class="stat-value">${stats.totalModuleViews}</div>
                    <div class="stat-label">módulos visitados</div>
                </div>
                <div class="stat-card">
                    <h3>⏱️ Duración Promedio</h3>
                    <div class="stat-value">${Math.round(stats.averageSessionDuration / 60)}</div>
                    <div class="stat-label">minutos por sesión</div>
                </div>
                <div class="stat-card">
                    <h3>🏆 Módulo Más Visto</h3>
                    <div class="stat-value" style="font-size: 1.2rem;">${stats.mostViewedModule}</div>
                    <div class="stat-label">más popular</div>
                </div>
            `;
        }

        // Cargar accesos recientes
        function loadRecentAccesses(accesses) {
            const container = document.getElementById('recentAccessesContainer');

            if (accesses.length === 0) {
                container.innerHTML = '<div class="empty-state"><i class="fa-solid fa-inbox"></i><p>No hay accesos registrados todavía</p></div>';
                return;
            }

            container.innerHTML = `
                <table class="access-table">
                    <thead>
                        <tr>
                            <th>Fecha y Hora</th>
                            <th>Estudiante</th>
                            <th>Student ID</th>
                            <th>Tipo</th>
                            <th>Duración</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${accesses.map(access => `
                            <tr>
                                <td>${formatDate(access.timestamp)}</td>
                                <td>${access.name}</td>
                                <td>${access.studentId}</td>
                                <td>
                                    <span class="badge ${access.isTeacher ? 'badge-teacher' : 'badge-student'}">
                                        ${access.isTeacher ? '👨‍🏫 Docente' : '🎓 Estudiante'}
                                    </span>
                                </td>
                                <td>${formatDuration(access.duration)}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        // Cargar todos los accesos
        function loadAllAccesses(accesses) {
            const container = document.getElementById('allAccessesContainer');

            if (accesses.length === 0) {
                container.innerHTML = '<div class="empty-state"><i class="fa-solid fa-inbox"></i><p>No hay accesos registrados</p></div>';
                return;
            }

            // Ordenar por fecha descendente
            const sorted = [...accesses].reverse();

            container.innerHTML = `
                <table class="access-table">
                    <thead>
                        <tr>
                            <th>Fecha y Hora</th>
                            <th>Estudiante</th>
                            <th>Student ID</th>
                            <th>Email</th>
                            <th>Tipo</th>
                            <th>Duración</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${sorted.map(access => `
                            <tr>
                                <td>${formatDate(access.timestamp)}</td>
                                <td>${access.name}</td>
                                <td>${access.studentId}</td>
                                <td>${access.email || 'N/A'}</td>
                                <td>
                                    <span class="badge ${access.isTeacher ? 'badge-teacher' : 'badge-student'}">
                                        ${access.isTeacher ? '👨‍🏫 Docente' : '🎓 Estudiante'}
                                    </span>
                                </td>
                                <td>${formatDuration(access.duration)}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        // Cargar estadísticas por estudiante
        function loadStudentStats(accesses) {
            const container = document.getElementById('studentStatsContainer');

            // Agrupar por estudiante
            const byStudent = {};
            accesses.forEach(access => {
                if (!byStudent[access.studentId]) {
                    byStudent[access.studentId] = {
                        name: access.name,
                        studentId: access.studentId,
                        email: access.email,
                        accesses: [],
                        totalDuration: 0
                    };
                }
                byStudent[access.studentId].accesses.push(access);
                byStudent[access.studentId].totalDuration += (access.duration || 0);
            });

            const students = Object.values(byStudent);

            if (students.length === 0) {
                container.innerHTML = '<div class="empty-state"><i class="fa-solid fa-users"></i><p>No hay estadísticas de estudiantes</p></div>';
                return;
            }

            container.innerHTML = `
                <table class="access-table">
                    <thead>
                        <tr>
                            <th>Student ID</th>
                            <th>Nombre</th>
                            <th>Total Accesos</th>
                            <th>Tiempo Total</th>
                            <th>Último Acceso</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${students.map(student => `
                            <tr>
                                <td>${student.studentId}</td>
                                <td>${student.name}</td>
                                <td>${student.accesses.length}</td>
                                <td>${formatDuration(student.totalDuration)}</td>
                                <td>${formatDate(student.accesses[student.accesses.length - 1].timestamp)}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        // Formatear fecha
        function formatDate(isoString) {
            const date = new Date(isoString);
            return date.toLocaleString('es-ES', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Formatear duración
        function formatDuration(seconds) {
            if (!seconds) return 'N/A';
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            if (mins > 0) {
                return `${mins}m ${secs}s`;
            }
            return `${secs}s`;
        }

        // Refrescar dashboard
        function refreshDashboard() {
            loadDashboard();
        }

        // Confirmar limpieza de datos
        function confirmClearData() {
            if (confirm('¿Estás seguro de que deseas eliminar los datos anteriores a 90 días?')) {
                Analytics.clearOldData(90);
                alert('✅ Datos antiguos eliminados correctamente');
                refreshDashboard();
            }
        }

        // Cargar al iniciar
        document.addEventListener('DOMContentLoaded', loadDashboard);
    </script>
</body>
</html>
